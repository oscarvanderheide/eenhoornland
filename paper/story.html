<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Papieren verhaal</title>
<!-- A sheet of the cut-paper cards of the story (paper/story.js): the witch, her potion and the little star. Every frame next to Anna, and all of them at phone size.
     story.html?marks rings the points the world needs (the bowl of the witch's spoon, her open hand, her feet). -->
<style>
html,body{margin:0;min-height:100%;background:#d9c7a7}
body{font:600 15px/1.3 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:#5a4636;padding-bottom:60px}
h2{margin:34px 0 0;text-align:center;font-size:17px;letter-spacing:.04em;color:#7a6250}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 26px;padding:26px 28px 0;box-sizing:border-box}
.row canvas{filter:drop-shadow(2px 5px 5px rgba(60,40,30,.35))}
.fr{display:flex;flex-direction:column;align-items:center;gap:6px}
.fr span{font-weight:500;font-size:12px;opacity:.7}
.name{padding:8px 28px 0;letter-spacing:.02em}
#phone canvas{filter:drop-shadow(1px 3px 3px rgba(60,40,30,.3))}
</style>
<div id="sheet"><div id="kaarten"></div></div>
<h2>op de telefoon</h2><div id="phone" class="row"></div>
<script type="module">
import { STORY } from './story.js';
import { FIGS, cutout, paperCanvas } from './figures.js';
const grain = paperCanvas(512, 7);
const bg = paperCanvas(512, 3, 1200, 1.3);
document.body.style.backgroundImage = `url(${bg.toDataURL()})`; document.body.style.backgroundBlendMode = 'multiply';
const BIG = 150, PHONE = 50, phone = document.getElementById('phone'), MARKS = new URLSearchParams(location.search).has('marks');
/** the points of a card the world needs, per frame: [frame, [x, y], what] */
const marks = a => [...(a.spoon || []).map((p, i) => [i, p, 'spoon']), ...(a.hand ? [[2, a.hand, 'hand']] : []), ...(a.feet ? Array.from({ length: a.frames }, (_, i) => [i, a.feet, 'feet']) : [])];
/** a card at `px` points per step of the world: its height is the figure's size, its width follows */
const card = (f, fr, px) => {
  const c = cutout(f.w, f.h, g => f.draw(g, fr), grain); c.style.height = f.size * px + 'px'; c.style.width = f.size * px * f.w / f.h + 'px';
  if (MARKS && f.does) { const g = c.getContext('2d'); g.globalCompositeOperation = 'source-over'; g.strokeStyle = '#2B6CD9'; g.lineWidth = 2.5; for (const [i, p] of marks(f)) if (i === fr) { g.beginPath(); g.arc(p[0] * 2, p[1] * 2, 9, 0, 7); g.stroke(); } }
  return c;
};
const anna = px => card(FIGS.anna, 0, px);

phone.append(anna(PHONE));
/** one row per card: Anna for scale, then every frame with its number and what it is; frame 0 also goes on the phone strip */
function rows(figs, into) {
  for (const [k, a] of Object.entries(figs)) {
    const row = document.createElement('div'); row.className = 'row'; row.id = 'row-' + k; row.append(anna(BIG));
    for (let f = 0; f < a.frames; f++) { const b = document.createElement('div'); b.className = 'fr'; const s = document.createElement('span'); s.textContent = f + ' ' + (a.does[f] || '?'); b.append(card(a, f, BIG), s); row.append(b); }
    const name = document.createElement('div'); name.className = 'name'; name.textContent = `${k}  (${a.size})`;
    into.append(row, name);
    phone.append(card(a, 0, PHONE));
  }
}
rows(STORY, document.getElementById('kaarten'));

/* checks for tests/t-story.mjs: no frame comes near the edge of its card, every frame has a name and is its own drawing,
   and the points the world needs lie on the paper */
const bad = [], room = {}, ROOM = 6;
/** how many units of empty canvas lie between the card and each edge: left, top, right, bottom */
const gap = (d, w, h) => { let x0 = w, x1 = -1, y0 = h, y1 = -1; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } return [x0, y0, w - 1 - x1, h - 1 - y1]; };
const data = (a, f) => cutout(a.w, a.h, g => a.draw(g, f), null, 1).getContext('2d').getImageData(0, 0, a.w, a.h).data;
/** the same without the backing card: only the paper itself */
const paper = (a, f) => cutout(a.w, a.h, g => a.draw(g, f), null, 1, 0).getContext('2d').getImageData(0, 0, a.w, a.h).data;
const differ = (p, q) => { let k = 0; for (let i = 3; i < p.length; i += 4) if (Math.abs(p[i] - q[i]) + Math.abs(p[i - 1] - q[i - 1]) + Math.abs(p[i - 3] - q[i - 3]) > 24) k++; return k; };
for (const [k, a] of Object.entries(STORY)) {
  if (a.does.length !== a.frames) bad.push(`${k}: ${a.frames} frames but ${a.does.length} names`);
  const all = [];
  for (let f = 0; f < a.frames; f++) {
    const d = data(a, f); all.push(d); let edge = 0, any = 0;
    for (let x = 0; x < a.w; x++) edge += d[x * 4 + 3] + d[((a.h - 1) * a.w + x) * 4 + 3];
    for (let y = 0; y < a.h; y++) edge += d[y * a.w * 4 + 3] + d[(y * a.w + a.w - 1) * 4 + 3];
    for (let i = 3; i < d.length; i += 4) if (d[i]) any++;
    if (edge) bad.push(`${k} frame ${f}: touches the edge of its card`);
    if (!any) bad.push(`${k} frame ${f}: nothing is drawn`);
    const r = gap(d, a.w, a.h); if (Math.min(...r) < ROOM) bad.push(`${k} frame ${f}: only ${Math.min(...r)} units between its card and the edge (left top right bottom ${r})`);
    room[k] = r.map((v, i) => Math.min(v, room[k] ? room[k][i] : 99));
    for (let e = 0; e < f; e++) if (differ(all[e], d) < 30) bad.push(`${k}: frame ${f} looks like frame ${e}`);
    const pp = paper(a, f);
    for (const [i, p, what] of marks(a)) if (i === f && what !== 'feet' && pp[(Math.round(p[1]) * a.w + Math.round(p[0])) * 4 + 3] < 200) bad.push(`${k} frame ${f}: its ${what} is not at ${p}`);
  }
}
window.__bad = bad; window.__room = room; window.__ready = true;
</script>
