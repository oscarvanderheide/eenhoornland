<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Papieren figuren</title>
<!-- A sheet of the cut-paper figures: Anna, Fenna, the baby unicorn and the grown unicorn, standing and two walking steps. -->
<style>
html,body{margin:0;min-height:100%;background:#d9c7a7}
body{font:600 15px/1.3 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:#5a4636}
#sheet{position:relative;min-height:100vh;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:28px 40px;padding:40px 24px 60px;box-sizing:border-box}
.fig{display:flex;flex-direction:column;align-items:center;gap:10px}
.big{filter:drop-shadow(2px 5px 5px rgba(60,40,30,.35))}
.steps{display:flex;gap:6px;align-items:flex-end}
.steps canvas{filter:drop-shadow(1px 3px 3px rgba(60,40,30,.3))}
.name{letter-spacing:.02em}
</style>
<div id="sheet"></div>
<script type="module">
import { FIGS, cutout, paperCanvas } from './figures.js';
const grain = paperCanvas(256, 7, 400);
const bg = paperCanvas(512, 3, 1200, 1.3);
document.body.style.backgroundImage = `url(${bg.toDataURL()})`; document.body.style.backgroundBlendMode = 'multiply';
const names = { anna: 'Anna', fenna: 'Fenna', baby: 'baby eenhoorn', grown: 'grote eenhoorn' };
const sheet = document.getElementById('sheet'), px = 1.05;
for (const [k, f] of Object.entries(FIGS)) {
  const box = document.createElement('div'); box.className = 'fig';
  const big = cutout(f.w, f.h, f.draw, grain); big.className = 'big'; big.style.width = f.w * px * f.size / 1.2 * (k === 'grown' ? .95 : 1) + 'px';
  const steps = document.createElement('div'); steps.className = 'steps';
  for (const fr of [1, 2]) { const c = cutout(f.w, f.h, (g) => f.draw(g, fr), grain); c.style.width = f.w * .42 * f.size + 'px'; steps.append(c); }
  const name = document.createElement('div'); name.className = 'name'; name.textContent = names[k];
  box.append(big, steps, name); sheet.append(box);
}
window.__ready = true;
</script>
